name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - feature/creality-support
    tags:
      - 'v*'
  # Builds the images without publishing them, so a pull request shows whether they still build
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Each image is built by Docker's reusable workflow, which builds every platform
# natively on its own runner (arm64 on an Arm runner rather than under QEMU),
# joins them into one multi-arch image, and signs the build's provenance.
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v7

      - name: Verify addon version matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION=$(node -p "require('./app/package.json').version")
          ADDON_VERSION=$(grep '^version:' spoolmansync-ha-addon/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          if [ "$APP_VERSION" != "$ADDON_VERSION" ]; then
            echo "::error::Version mismatch! package.json=$APP_VERSION, config.yaml=$ADDON_VERSION"
            exit 1
          fi
          echo "Versions match: $APP_VERSION"

  # Main app image (multi-arch: amd64 + arm64)
  app:
    needs: check-version
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write # to push to ghcr.io
      id-token: write # to sign the provenance and cache with GitHub OIDC
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      context: app
      cache: true
      cache-scope: app
      cache-mode: max
      set-meta-labels: true
      meta-images: |
        ghcr.io/${{ github.repository_owner }}/spoolmansync
        docker.io/gibz104/spoolmansync
      meta-tags: |
        # Set latest tag for main branch and version tags
        type=raw,value=latest,enable={{is_default_branch}}
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
        # Set version tag (v1.0.0 -> 1.0.0)
        type=semver,pattern={{version}}
        # Set major.minor tag (v1.0.0 -> 1.0)
        type=semver,pattern={{major}}.{{minor}}
        # Beta tag for feature branches
        type=raw,value=creality-beta,enable=${{ github.ref == 'refs/heads/feature/creality-support' }}
        # Names a pull request's build, which is never pushed
        type=ref,event=pr
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  # Home Assistant image (multi-arch: amd64 + arm64)
  homeassistant:
    needs: check-version
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      context: homeassistant
      cache: true
      cache-scope: homeassistant
      cache-mode: max
      set-meta-labels: true
      meta-images: |
        ghcr.io/${{ github.repository_owner }}/spoolmansync-homeassistant
        docker.io/gibz104/spoolmansync-homeassistant
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=creality-beta,enable=${{ github.ref == 'refs/heads/feature/creality-support' }}
        type=ref,event=pr
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  # HA add-on image (multi-arch: amd64 + arm64)
  # Context is repo root since Dockerfile needs both app/ and spoolmansync-ha-addon/rootfs/
  addon:
    needs: check-version
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      context: .
      file: spoolmansync-ha-addon/Dockerfile
      cache: true
      cache-scope: addon
      cache-mode: max
      set-meta-labels: true
      meta-images: |
        ghcr.io/${{ github.repository_owner }}/spoolmansync-addon
        docker.io/gibz104/spoolmansync-addon
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=creality-beta,enable=${{ github.ref == 'refs/heads/feature/creality-support' }}
        type=ref,event=pr
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
